[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Proxy: todo lo que va a /api se reenvía a Railway, sin el /api
[[redirects]]
  from = "/api/*"
  to = "https://e-stellarium-api.up.railway.app/:splat"
  status = 200
  force = true

# Cualquier otra ruta la maneja React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200